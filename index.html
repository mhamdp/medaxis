async function syncContext() {
  const key = session.user ? `${session.user.id}:${session.user.role}` : 'guest';
  await refreshRecipientGender();
  if (currentContext === null) { currentContext = key; return; }
  if (key === currentContext) return;
  currentContext = key;
  clearConversation();
  if (!panel.hidden) { firstOpen = false; showWelcome(); }
}

const norm = (s) => String(s || '').toLowerCase().replace(/[أإآ]/g, 'ا').replace(/ى/g, 'ي').replace(/[ً-ْٰـ]/g, '');
function normalizeWord(word) {
  return norm(word).replace(/^ال(?=.{2,}$)/, '');
}
const stopWords = new Set((
  'who which are is was were today tonight working scheduled available availability open slots doctor doctors dr clinic the any on at in here have has and tell me please there appointments doctor list ' +
  'مين من ايه اي ما هي هو هل بكره بكرة النهارده النهاردة نهارده نهاردة اليوم الموجود الموجوده موجودة الموجودين موجودات الموجودون الشغال الشغاله الشغالة الشغالين الدكاترة الدكاتره دكاترة دكاتره دكتور دكتورة الطبيب الأطباء الاطباء طبيب اللي عند فيه متاح متاحة متاحه متاحين مواعيد مواعيدهم مواعيدها قول قولي عايز عايزة عايزاه في جدول الدكاتره'
).split(/\s+/).map(normalizeWord));
function doctorNameMatch(question, doctors) {
  const terms = question.toLowerCase().replace(/[؟?،,.!]/g, ' ').split(/\s+/).map(normalizeWord).filter((w) => w && !stopWords.has(w));
  if (!terms.length) return null;
  const aliases = { 'مونا': 'mona', 'مني': 'mona', 'كريم': 'karim', 'ياسمين': 'yasmin' };
  const normalizedTerms = terms.map((term) => aliases[term] || term);
  return doctors.find((doctor) => {
    const known = `${doctor.name || ''} ${doctor.name_en || ''}`
      .replace(/\bdr\.?\b/gi, ' ')
      .split(/[^\p{L}\p{N}]+/u)
      .map(normalizeWord)
      .filter((word) => word.length >= 3);
    return normalizedTerms.some((term) => known.includes(term));
  }) || null;
}
const displayName = (d, lang) => (lang === 'ar' ? d.name : d.name_en || d.name);
const specName = (d, lang) => (lang === 'ar' ? d.specialty_ar : d.specialty_en || d.specialty_ar);
const dayLabel = (date, lang) => {
  if (date === ymd()) return text[lang].today;
  if (date === addDays(ymd(), 1)) return text[lang].tomorrow;
  const dow = new Date(`${date}T12:00:00`).getDay();
  return `${weekdayName(dow)} ${fmt.short(date)}`;
};

async function activeDoctors() {
  const { doctors } = await GET('/doctors');
  return doctors.filter((d) => Boolean(Number(d.active)));
}

/* Which doctors work on a given day, with their free slots */
async function scheduleFor(question, lang, offsetDays) {
  const t = text[lang];
  if (!session.user) return { message: t.notSigned };
  const doctors = await activeDoctors();
  const chosen = doctorNameMatch(question, doctors);
  const targets = chosen ? [chosen] : doctors;
  const date = addDays(ymd(), offsetDays);
  const schedules = await Promise.all(targets.map(async (doctor) => {
    const result = await GET(`/doctors/${doctor.id}/slots${qs({ date })}`);
    return { doctor, off: result.off, free: result.slots.filter((slot) => slot.available).map((slot) => slot.time) };
  }));
  const dayWord = offsetDays === 1 ? t.tomorrow : t.today;
  if (chosen) {
    const selected = schedules[0];
    if (selected.off) return { message: t.doctorOff(displayName(chosen, lang), dayWord) };
    const times = selected.free.slice(0, 3).map(fmt.time).join('، ');
    return { message: t.doctorWorks(displayName(chosen, lang), `${fmt.time(chosen.start_time)} - ${fmt.time(chosen.end_time)}`, selected.free.length, times), links: ['appointments'] };
  }
  const working = schedules.filter((item) => !item.off);
  if (!working.length) return { message: t.noSchedule };
  const lines = working.map(({ doctor, free }) => t.scheduleRow(
    displayName(doctor, lang), specName(doctor, lang),
    `${fmt.time(doctor.start_time)} - ${fmt.time(doctor.end_time)}`,
    free.length, free.slice(0, 2).map(fmt.time).join('، '),
  ));
  return { message: `${offsetDays === 1 ? t.scheduleTitleTomorrow : t.scheduleTitle}\n${lines.join('\n')}`, links: ['appointments'] };
}

/* Nearest free slot per doctor, up to 3 suggestions, searching 15 days ahead */
async function nearestSlots(lang) {
  const t = text[lang];
  if (!session.user) return { message: t.notSigned };
  const found = [];
  for (const d of await activeDoctors()) {
    for (let i = 0; i < 15; i++) {
      const date = addDays(ymd(), i);
      const res = await GET(`/doctors/${d.id}/slots${qs({ date })}`);
      if (res.off) continue;
      const slot = res.slots.find((s) => s.available);
      if (slot) { found.push({ doctor: d, date, time: slot.time }); break; }
    }
    if (found.length >= 3) break;
  }
  if (!found.length) return { message: t.noNearest };
  const lines = found.map((f) => t.nearestRow(displayName(f.doctor, lang), dayLabel(f.date, lang), fmt.time(f.time)));
  return { message: `${t.nearestTitle}\n${lines.join('\n')}`, links: ['doctors', 'appointments'] };
}

/* Find a doctor by specialty words, Arabic aliases included */
const specAliases = [
  { match: ['جلد', 'بشرة', 'بشره', 'حبوب', 'شعر', 'dermat', 'skin', 'hair'], words: ['جلدية', 'جلديه', 'dermat'] },
  { match: ['اسنان', 'أسنان', 'سنان', 'ضرس', 'ضروس', 'لثة', 'لثه', 'dent', 'teeth', 'tooth'], words: ['أسنان', 'اسنان', 'dent'] },
  { match: ['باطنة', 'باطنه', 'سكر', 'سكري', 'ضغط', 'internal', 'diabet'], words: ['باطنة', 'باطنه', 'internal', 'diabet'] },
];
function doctorBySpecialty(question, doctors) {
  const nq = norm(question);
  for (const d of doctors) {
    const spec = norm(`${d.specialty_ar || ''} ${d.specialty_en || ''}`);
    for (const a of specAliases) {
      if (a.match.some((w) => nq.includes(norm(w))) && a.words.some((w) => spec.includes(norm(w)))) return d;
    }
    const specWords = spec.split(/[^\p{L}]+/u).filter((w) => w.length >= 3);
    if (specWords.some((w) => nq.includes(w))) return d;
  }
  return null;
}

function doctorInfoAnswer(d, lang) {
  const t = text[lang];
  const days = d.work_days.split(',').map(Number).sort((a, b) => ((a + 1) % 7) - ((b + 1) % 7)).map((n) => weekdayName(n, 'short')).join(lang === 'ar' ? '، ' : ', ');
  return { message: t.doctorInfo(displayName(d, lang), specName(d, lang), fmt.money(d.fee), `${fmt.time(d.start_time)} - ${fmt.time(d.end_time)}`, days), links: ['doctors'] };
}

async function feesAnswer(question, lang) {
  const t = text[lang];
  if (!session.user) return { message: t.notSigned };
  const doctors = await activeDoctors();
  const named = doctorNameMatch(question, doctors);
  if (named) return doctorInfoAnswer(named, lang);
  const lines = doctors.map((d) => t.feeRow(displayName(d, lang), specName(d, lang), fmt.money(d.fee)));
  return { message: `${t.feesTitle}\n${lines.join('\n')}`, links: ['doctors'] };
}

function containsAny(value, words) { return words.some((word) => value.includes(word)); }
async function answer(question, lang) {
  const q = question.toLowerCase();
  const t = text[lang];
  const role = session.user?.role;
  if (containsAny(q, ['symptom', 'diagnos', 'treatment', 'medicine', 'medication', 'dosage', 'pain', 'fever', 'اعراض', 'أعراض', 'تشخيص', 'علاج', 'دواء', 'جرعة', 'ألم', 'وجع', 'حرارة', 'مريض احس'])) return { message: t.medical };
  if (containsAny(q, ['what can i do', 'my role', 'my permissions', 'صلاحياتي', 'دوري في النظام', 'أقدر أعمل', 'اقدر اعمل'])) return { message: role ? t.roleInfo[role] : t.notSigned, links: role ? Object.keys(routeRoles).filter((page) => allowed(page)) : [] };
  if (containsAny(q, ['شكرا', 'متشكر', 'thank'])) return { message: t.thanks };
  if (containsAny(q, ['اهلا', 'أهلا', 'السلام', 'صباح الخير', 'مساء الخير', 'hello', 'hi ']) || q.trim() === 'hi') return { message: t.hello };

  const asksToday = containsAny(q, ['today', 'tonight', 'النهارده', 'النهاردة', 'نهارده', 'نهاردة', 'اليوم']);
  const asksTomorrow = containsAny(q, ['بكرة', 'بكره', 'tomorrow']);
  const asksWho = containsAny(q, ['who', 'which', 'مين', 'من هم', 'من هما']);
  const asksDoctor = containsAny(q, ['doctor', 'doctors', 'dr ', 'دكتور', 'دكتورة', 'دكاترة', 'دكاتره', 'طبيب', 'الأطباء', 'الاطباء', 'الدكاترة', 'الدكاتره']);
  const asksAvailability = containsAny(q, ['available', 'availability', 'working', 'scheduled', 'present', 'open slot', 'موجود', 'موجودة', 'موجوده', 'موجودين', 'شغال', 'شغالة', 'شغاله', 'شغالين', 'متاح', 'متاحة', 'متاحه', 'متاحين']);

  /* nearest free slot */
  if (containsAny(q, ['اقرب ميعاد', 'أقرب ميعاد', 'اقرب حجز', 'اقرب معاد', 'أقرب معاد', 'nearest', 'earliest slot', 'اول ميعاد فاضي', 'أول ميعاد فاضي'])) return await nearestSlots(lang);

  /* prices */
  if (containsAny(q, ['بكام', 'بكم', 'سعر الكشف', 'سعر', 'تكلفة', 'تكليفه', 'فلوس', 'price', 'cost', 'fee', 'how much'])) return await feesAnswer(question, lang);

  /* schedule questions */
  if ((asksTomorrow && (asksDoctor || asksAvailability || asksWho || containsAny(q, ['جدول']))) || (asksTomorrow && asksToday === false && asksWho)) return await scheduleFor(question, lang, 1);
  if ((asksToday && (asksDoctor || asksAvailability || asksWho)) || (asksDoctor && asksAvailability) || containsAny(q, ['جدول النهارده', 'جدول النهاردة'])) return await scheduleFor(question, lang, 0);

  /* a doctor by specialty: "عايز دكتور جلدية" */
  if (session.user && (containsAny(q, ['عايز', 'عايزة', 'بدور', 'ابحث', 'محتاج', 'كشف']) || asksDoctor)) {
    const d = doctorBySpecialty(question, await activeDoctors());
    if (d) return doctorInfoAnswer(d, lang);
  }

  const ownAppointments = containsAny(q, ['my appointments', 'my appointment', 'mine', 'مواعيدي', 'موعدي', 'عندي مواعيد', 'مواعيدي ايه', 'مواعيدي إيه']);
  if (ownAppointments) {
    if (!role) return { message: t.notSigned };
    if (role === 'admin' || role === 'receptionist') return { message: t.appointments, links: ['appointments'] };
    const { appointments } = await GET(`/appointments${qs(asksToday ? { date: ymd() } : { upcoming: '1' })}`);
    const rows = asksToday ? appointments : appointments.slice(0, 5);
    return { message: t.myAppointments(rows, role), links: ['appointments'] };
  }
  if (containsAny(q, ['الغي', 'ألغي', 'الغاء', 'إلغاء', 'cancel'])) return { message: t.cancelHow, links: ['appointments'] };
  if (containsAny(q, ['how to book', 'book an appointment', 'booking', 'حجز', 'احجز', 'أحجز', 'ازاي احجز', 'إزاي أحجز', 'كيف احجز'])) {
    return { message: role === 'doctor' ? t.appointments : t.booking, links: ['appointments'] };
  }
  if (containsAny(q, ['medical record', 'records', 'history', 'سجل', 'السجل', 'السجلات', 'الملف الطبي'])) return allowed('records') ? { message: t.records, links: ['records'] } : { message: t.restricted };
  if (asksDoctor) {
    return allowed('doctors') ? { message: t.doctors, links: ['doctors'] } : { message: t.restricted };
  }
  if (containsAny(q, ['staff', 'employee', 'employees', 'موظف', 'الموظفين', 'الموظفون'])) return allowed('staff') ? { message: t.staff, links: ['staff'] } : { message: t.restricted };
  if (containsAny(q, ['patient', 'patients', 'مريض', 'مرضى', 'المرضى'])) return allowed('patients') ? { message: t.patients, links: ['patients'] } : { message: t.restricted };
  if (containsAny(q, ['appointment', 'appointments', 'calendar', 'موعد', 'مواعيد', 'الحجوزات'])) return allowed('appointments') ? { message: t.appointments, links: ['appointments'] } : { message: t.restricted };
  if (containsAny(q, ['profile', 'account', 'password', 'حساب', 'بياناتي', 'كلمة المرور', 'كلمة السر'])) return { message: t.profile, links: ['profile'] };
  if (containsAny(q, ['login', 'sign in', 'log in', 'تسجيل الدخول', 'دخول'])) return { message: t.notSigned };
  return { message: t.fallback };
}

async function sendQuestion(question) {
  const value = question.trim();
  if (!value) return;
  await refreshRecipientGender();
  const lang = currentLang(value);
  chrome(lang);
  addBubble(value, 'user', lang);
  input.value = '';
  input.dir = 'auto';
  const typing = showTyping(lang);
  try {
    const [result] = await Promise.all([answer(value, lang), new Promise((r) => setTimeout(r, 550))]);
    typing.remove();
    addBubble(result.message, 'bot', lang, result.links || []);
  } catch (error) {
    console.error('MEDAXIS assistant:', error);
    typing.remove();
    addBubble(lang === 'ar' ? 'حصلت مشكلة وأنا بجيب المعلومات. جرّب مرة تانية.' : 'I couldn’t load that information. Please try again.', 'bot', lang);
  }
}
const vv = window.visualViewport || null;
const isMobileChat = () => window.matchMedia('(max-width: 900px)').matches;
function syncChatSheet() {
  if (panel.hidden || !isMobileChat()) return;
  if (vv) {
    panel.style.top = Math.max(6, vv.offsetTop + 6) + 'px';
    panel.style.height = Math.max(280, vv.height - 12) + 'px';
  } else {
    panel.style.top = '8px';
    panel.style.height = 'calc(100dvh - 16px)';
  }
}
function setChatSheet(open) {
  const mobile = open && isMobileChat();
  document.body.classList.toggle('chat-open', mobile);
  if (mobile) {
    syncChatSheet();
    if (vv) { vv.addEventListener('resize', syncChatSheet); vv.addEventListener('scroll', syncChatSheet); }
  } else {
    panel.style.top = ''; panel.style.height = '';
    if (vv) { vv.removeEventListener('resize', syncChatSheet); vv.removeEventListener('scroll', syncChatSheet); }
  }
}
window.addEventListener('resize', () => { if (!panel.hidden) setChatSheet(true); });
async function openChat(open) {
  await syncContext();
  panel.hidden = !open;
  toggle.setAttribute('aria-expanded', String(open));
  setChatSheet(open);
  if (!open) return;
  if (firstOpen) {
    firstOpen = false;
    if (languageMode === 'choose') showLanguagePicker();
    else { const lang = currentLang(); addBubble(roleWelcome(lang), 'bot', lang); renderTopics(lang); }
  }
  input.focus();
}

toggle.addEventListener('click', () => openChat(panel.hidden));
close.addEventListener('click', () => openChat(false));
languageButton.addEventListener('click', showLanguagePicker);
topicsButton.addEventListener('click', () => renderTopics(currentLang(), topicsHost.hidden));
input.addEventListener('input', () => { input.dir = currentLang(input.value) === 'ar' ? 'rtl' : 'ltr'; });
form.addEventListener('submit', (event) => { event.preventDefault(); sendQuestion(input.value); });
const gate = () => { toggle.hidden = !session.user; };
window.addEventListener('medaxis:logout', () => { setChatSheet(false); panel.hidden = true; toggle.hidden = true; toggle.setAttribute('aria-expanded', 'false'); currentContext = 'guest'; genderContextKey = 'guest'; recipientGender = 'male'; clearConversation(); });
window.addEventListener('medaxis:login', () => { gate(); syncContext(); });
window.addEventListener('hashchange', () => { gate(); syncContext(); });
gate();
return {};
})();

})();
</script>
